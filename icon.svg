<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26202a"/>
      <stop offset="1" stop-color="#14111a"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a7e"/>
      <stop offset="1" stop-color="#ff3b55"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="4"/>
  <!-- vim command prompt: ":" then a block cursor -->
  <circle cx="156" cy="196" r="34" fill="url(#ac)"/>
  <circle cx="156" cy="316" r="34" fill="url(#ac)"/>
  <rect x="236" y="116" width="156" height="280" rx="22" fill="url(#ac)"/>
  <!-- cider leaf on the cursor -->
  <path d="M330 116 C330 66 366 40 412 40 C412 90 380 116 330 116 Z" fill="#8fdc8f"/>
  <!-- keyboard underline -->
  <rect x="116" y="436" width="280" height="14" rx="7" fill="#ffffff" fill-opacity=".18"/>
</svg>
